<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List in html</title>
    <style>
        h1{
            color: blueviolet;
        }
        h3{
            color: brown;
        }
    </style>
</head>
<body>
    <h1>Animals</h1>
    <ol>
        <li>
            <h3>Domestic Animals</h3>
        </li>
    <ul>
        <li>Dog</li>
        <li>Cat</li>
        <li>Cow</li>
        <li>Goat</li>
    </ul>
        <li>
            <h3>Wild Animals</h3>
        </li>
    <ul>
        <li>Lion</li>
        <li>Tiger</li>
        <li>Bear</li>
        <li>Deer</li>
    </ul>
    </ol>
</body>
</html>
